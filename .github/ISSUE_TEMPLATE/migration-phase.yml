name: Migration phase
description: Trigger one phase of the Angular 14 to 18 migration
title: "Phase <n>: <name>"
labels: ["migration"]
body:
  - type: markdown
    attributes:
      value: |
        One tracking issue per phase. Open it nearly empty — Devin reads the code and posts a
        costed plan as a comment: the PR breakdown, an estimate per PR, the risks, and what could
        block it. **It writes no code until a maintainer adds `devin:approved`**, so what you are
        approving is a specific plan at a specific price, not a vague intent.

        The phase is finished when every box in **PRs** is checked. Nothing from the next phase
        branches until then.

  - type: dropdown
    id: phase
    attributes:
      label: Phase
      options:
        - "0 — Harness: Storybook, axe, evidence, API and dependency reports"
        - "1 — Walk to v16: 14 to 15 to 16, remove @angular/flex-layout"
        - "2 — Legacy to MDC: theme and all components"
        - "3 — v16 to v18: through the v17 gate"
    validations:
      required: true

  - type: input
    id: baseline
    attributes:
      label: Evidence baseline to compare against
      description: >
        Leave as `baseline` unless you deliberately want a different one — it resolves through
        .storybook-evidence/baseline.json, so it stays correct across migrations.
      value: baseline
    validations:
      required: true

  - type: textarea
    id: prs
    attributes:
      label: PRs
      description: >
        Leave blank. Devin fills this in at triage with one line per PR and an estimate, then edits
        the boxes closed as they merge.
      placeholder: |
        | PR | Estimate | Risk |
        |---|---|---|
        | Remove @angular/flex-layout | | |
    validations:
      required: false

  - type: textarea
    id: done
    attributes:
      label: Done when (every PR above)
      value: |
        - [ ] `bofa-design-system`, `digital-banking-shell` and `advisor-console` all build
        - [ ] `npx ng test` passes
        - [ ] `npm run build-storybook` succeeds and every story renders
        - [ ] `npm run evidence -- --compare <baseline> <this phase>` exits 0
        - [ ] `npm run api-report -- --check` exits 0, or the public API change is argued and accepted
        - [ ] `npm run deps-report -- --check` exits 0
        - [ ] No unresolved `TODO(mdc-migration):`
        - [ ] No rule in `BRAND_CONTRACT.md` violated
        - [ ] What the phase taught is written back into `AGENTS.md` or `BRAND_CONTRACT.md`
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Known traps for this phase
      description: Anything already known that Devin should not have to rediscover.
    validations:
      required: false
