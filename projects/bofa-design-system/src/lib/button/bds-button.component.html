<!--
  NOTE (intentional v14 pattern): this uses the pre-MDC Material button API.
  When @angular/material is upgraded past v15, `ng update` will either
  rewrite these to the MatLegacy* equivalents (if the legacy import path is
  kept) or require moving to the MDC-based `mat-button` API surface. This is
  one of the real breaking-change points in a 14 -> 18 upgrade for any app
  built on Material, not something specific to this demo app.
-->
<button
  mat-raised-button
  *ngIf="variant === 'primary'"
  color="primary"
  class="bds-button"
  [disabled]="disabled || loading"
  (click)="onClick($event)"
>
  <ng-content></ng-content>
</button>

<button
  mat-stroked-button
  *ngIf="variant === 'secondary'"
  class="bds-button"
  [disabled]="disabled || loading"
  (click)="onClick($event)"
>
  <ng-content></ng-content>
</button>

<button
  mat-raised-button
  *ngIf="variant === 'danger'"
  color="warn"
  class="bds-button"
  [disabled]="disabled || loading"
  (click)="onClick($event)"
>
  <ng-content></ng-content>
</button>
