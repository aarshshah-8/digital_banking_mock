<button
  mat-raised-button
  *ngIf="variant === 'primary'"
  color="primary"
  class="bds-button"
  [disabled]="disabled || loading"
  (click)="onClick($event)"
>
  <ng-content></ng-content>
</button>

<button
  mat-stroked-button
  *ngIf="variant === 'secondary'"
  class="bds-button"
  [disabled]="disabled || loading"
  (click)="onClick($event)"
>
  <ng-content></ng-content>
</button>

<button
  mat-raised-button
  *ngIf="variant === 'danger'"
  class="bds-button bds-button--danger"
  [disabled]="disabled || loading"
  (click)="onClick($event)"
>
  <ng-content></ng-content>
</button>
